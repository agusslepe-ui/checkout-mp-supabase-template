<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Revisá tu carrito LEMONT y continuá tu compra.">
    <title>Carrito — LEMONT</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@500;600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/reset.css">
    <link rel="stylesheet" href="css/styles.css">
    <link rel="stylesheet" href="css/components.css">
    <script type="module" src="js/app.js"></script>
    <script type="module" src="js/carrito.js"></script>
  </head>
  <body data-page="carrito">
    <div data-site-header></div>
    <main class="cart-page shell" data-cart-page>
      <a class="product-page__back" href="catalogo.html">← Seguir comprando</a>
      <p class="eyebrow eyebrow--accent">Tu selección</p>
      <h1>Carrito</h1>
      <p class="cart-note">El backend determina los importes. El límite temporal de 4 por variante no representa stock. El envío no está incluido en el total.</p>
      <p class="form-status" data-cart-status aria-live="polite"></p>
      <div class="cart-lines" data-cart-lines></div>
      <p class="cart-total" data-cart-total></p>
      <div class="cart-actions">
        <button class="button button--secondary" type="button" data-cart-clear hidden>Vaciar carrito</button>
        <button class="button button--secondary" type="button" data-cart-retry hidden>Reintentar resumen</button>
        <button class="button button--accent" type="button" data-cart-continue disabled>Continuar compra</button>
      </div>
    </main>
    <div data-site-footer></div>
  </body>
</html>
